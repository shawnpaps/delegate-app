services:
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
      args:
        VITE_CONVEX_URL: ${VITE_CONVEX_URL:?Set VITE_CONVEX_URL to your production Convex client URL}
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-https://delegateapi.sudocreate.app}
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?Set VITE_CLERK_PUBLISHABLE_KEY to your production Clerk publishable key}
    container_name: delegate-app-frontend
    expose:
      - "80"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik-qfiy}"
      - "traefik.http.routers.delegate-frontend.rule=Host(`${FRONTEND_HOST:-delegate.sudocreate.app}`)"
      - "traefik.http.routers.delegate-frontend.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.delegate-frontend.tls=true"
      - "traefik.http.routers.delegate-frontend.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.services.delegate-frontend.loadbalancer.server.port=80"
    networks:
      - delegate-internal
      - traefik
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: delegate-app-backend
    environment:
      PORT: ${PORT:-3001}
      RESEND_API_KEY: ${RESEND_API_KEY:?Set RESEND_API_KEY}
      RESEND_DOMAIN: ${RESEND_DOMAIN:?Set RESEND_DOMAIN}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:?Set RESEND_WEBHOOK_SECRET}
      CONVEX_HTTP_URL: ${CONVEX_HTTP_URL:?Set CONVEX_HTTP_URL to your production Convex HTTP actions URL}
      CONVEX_ADMIN_KEY: ${CONVEX_ADMIN_KEY:?Set CONVEX_ADMIN_KEY}
      BACKEND_URL: ${BACKEND_URL:-https://delegateapi.sudocreate.app}
    expose:
      - "3001"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=${TRAEFIK_NETWORK:-traefik-qfiy}"
      - "traefik.http.routers.delegate-backend.rule=Host(`${BACKEND_HOST:-delegateapi.sudocreate.app}`)"
      - "traefik.http.routers.delegate-backend.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.delegate-backend.tls=true"
      - "traefik.http.routers.delegate-backend.tls.certresolver=${TRAEFIK_CERT_RESOLVER:-letsencrypt}"
      - "traefik.http.services.delegate-backend.loadbalancer.server.port=3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - delegate-internal
      - traefik
    restart: unless-stopped

networks:
  delegate-internal:
    driver: bridge
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-traefik-qfiy}
